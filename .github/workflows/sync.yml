name: Run Wind Turbine Sync

on:
  schedule:
    # รันอัตโนมัติทุกๆ 10 นาที
    - cron: '*/10 * * * *'
  workflow_dispatch: # ปุ่มสำหรับกดรันด้วยตนเองผ่านหน้าเว็บ

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Prachaya.py Script
        run: python Prachaya.py
