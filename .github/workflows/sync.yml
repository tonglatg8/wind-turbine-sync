name: Run Wind Turbine Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Prachaya.py Script
        env:
          GREENBYTE_TOKEN: ${{ secrets.GREENBYTE_TOKEN }}
          MAINTAINX_TOKEN: ${{ secrets.MAINTAINX_TOKEN }}
        run: python Prachaya.py

      # ส่งอีเมลผ่าน Outlook / Office 365 SMTP Server
      - name: Send mail on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ⚠️ [ALERT] Wind Turbine Sync Script Failed!
          to: prachaya@windenergyholding.com, amata@windenergyholding.com, sanpetch@windenergyholding.com
          from: GitHub Actions Alert <prachaya@windenergyholding.com>
          body: |
            ระบบตรวจเช็กกังหันลม (Prachaya.py) เกิดข้อผิดพลาดวิกฤตนะจ๊ะ
            กรุณาตรวจสอบ Log บน GitHub Actions ทันที
