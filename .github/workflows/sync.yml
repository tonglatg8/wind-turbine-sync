name: Run Wind Turbine Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Prachaya.py Script
        env:
          GREENBYTE_TOKEN: ${{ secrets.GREENBYTE_TOKEN }}
          MAINTAINX_TOKEN: ${{ secrets.MAINTAINX_TOKEN }}
        run: python Prachaya.py
